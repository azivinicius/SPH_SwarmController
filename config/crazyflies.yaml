fileversion: 3

robots:
  cf_0:
    enabled: true
    uri: udp://127.0.0.1:19850
    initial_position: [0.5100, 0.0000, 0.0]
    type: cf_sim
  cf_1:
    enabled: true
    uri: udp://127.0.0.1:19851
    initial_position: [0.1576, 0.4850, 0.0]
    type: cf_sim
  cf_2:
    enabled: true
    uri: udp://127.0.0.1:19852
    initial_position: [-0.4126, 0.2998, 0.0]
    type: cf_sim
  cf_3:
    enabled: true
    uri: udp://127.0.0.1:19853
    initial_position: [-0.4126, -0.2998, 0.0]
    type: cf_sim
  cf_4:
    enabled: true
    uri: udp://127.0.0.1:19854
    initial_position: [0.1576, -0.4850, 0.0]
    type: cf_sim

robot_types:
  cf_sim:
    motion_capture:
      tracking: "vendor"
    big_quad: false
    firmware_logging:
      enabled: true
      default_topics:
        pose:
          frequency: 10

all:
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 10
      status:
        frequency: 1
    custom_topics:
      state:
        frequency: 20
        vars:
          - "stateEstimate.x"
          - "stateEstimate.y"
          - "stateEstimate.z"
          - "stateEstimate.vx"
          - "stateEstimate.vy"
          - "stateEstimate.vz"
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2
      controller: 1
    locSrv:
      extPosStdDev: 1e-3
      extQuatStdDev: 0.5e-1
  reference_frame: "world"
  broadcasts:
    num_repeats: 15
    delay_between_repeats_ms: 1 