      enabled: true
      default_topics:
        pose:
          frequency: 10

all:
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 10
      status:
        frequency: 1
    custom_topics:
      state:
        frequency: 20
        vars:
          - "stateEstimate.x"
          - "stateEstimate.y"
          - "stateEstimate.z"
          - "stateEstimate.vx"
          - "stateEstimate.vy"
          - "stateEstimate.vz"
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2
      controller: 1
    locSrv:
      extPosStdDev: 1e-3
      extQuatStdDev: 0.5e-1
  reference_frame: "world"
  broadcasts:
    num_repeats: 15
    delay_between_repeats_ms: 1 