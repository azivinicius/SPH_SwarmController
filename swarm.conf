# swarm.conf -- every knob for a run lives here. Shell syntax (KEY=value).
# Any value can be overridden per-run from the command line:
#   N_DRONES=5 POT_R=0.8 ./dev_tmux.sh up
# or point at another file:  CONF=configs/five_drones.conf ./dev_tmux.sh up

# --- swarm size / spawn layout -------------------------------------------
N_DRONES=${N_DRONES:-3}
SPAWN_LAYOUT=${SPAWN_LAYOUT:-grid}      # grid (neighbours SPH_SPACING apart, centred on 0,0) | ring (see SPAWN_RADIUS)
SPAWN_RADIUS=${SPAWN_RADIUS:-auto}     # drones spawn evenly spaced on a circle of this radius, centred on (0,0).
                                       # auto = ring grows with N so the SPH density stays at SPH_RHO0 for a fixed SPH_MASS
MIN_SPACING=${MIN_SPACING:-0.3}        # auto radius never puts neighbours closer than this (m)

# --- external potential (circle, 2D) -------------------------------------
POT_XC=${POT_XC:-2.0}
POT_YC=${POT_YC:-2.0}
POT_R=${POT_R:-auto}                   # target circle radius; auto = same as the spawn radius
POT_K=${POT_K:-2.0}                    # f_k
POT_BETA=${POT_BETA:-1.0}              # f_beta

# --- SPH constants (defaults = current values in plain_sph.py) ------------
SPH_MASS=${SPH_MASS:-7000.0}           # a number, or auto = solved so neighbours sit SPH_SPACING apart (see below)
SPH_SPACING=${SPH_SPACING:-0.6}        # wanted neighbour spacing (m); only used when SPH_MASS=auto
SPH_H=${SPH_H:-0.3}
SPH_RHO0=${SPH_RHO0:-1000.0}
SPH_GAMMA=${SPH_GAMMA:-3.0}
SPH_ALPHA=${SPH_ALPHA:-1.0}
SPH_BETA=${SPH_BETA:-2.0}
SPH_ZETTA=${SPH_ZETTA:-40.0}           # zetta_extra (extra damping)

#----- Obstacles ---------------
OBSTACLES=${OBSTACLES:-none}           # static obstacle particles, '/' between them (m, world frame); none = no obstacles
                                       # 2D: 'x,y'   3D: 'x,y,z' = one particle, 'x,y' = pillar (column z_min..z_max, SPH_H apart)
OBS_SIGMA=${OBS_SIGMA:-10.0}          # obstacle self-density = OBS_SIGMA * SPH_RHO0 (Pimenta eq. 39); keep it above the drones' own density

# --- flight --------------------------------------------------------------
FIXED_Z=${FIXED_Z:-0.5}
TAKEOFF_HEIGHT=${TAKEOFF_HEIGHT:-0.5}
AUTO_TAKEOFF=${AUTO_TAKEOFF:-1}        # 1 = call /all/takeoff once Crazyswarm2 is up
RVIZ=${RVIZ:-True}                     # True/False

# --- startup delays (seconds) -- raise if a stage starts before the previous one is ready
SIM_WAIT=${SIM_WAIT:-15}
SWARM_WAIT=${SWARM_WAIT:-15}
TAKEOFF_WAIT=${TAKEOFF_WAIT:-20}

# --- diagnostics & experiments (defaults == old behaviour) ---------------------
# Every run is written to src/logs/runs/<timestamp>_<RUN_LABEL>/ ; analyse with ./dev_tmux.sh analyze
RUN_LABEL=${RUN_LABEL:-run}            # short name of this experiment (goes into the folder name)
SPH_GAIN=${SPH_GAIN:-1.0}              # multiplies the SPH force only. 0 = SPH off (damping + potential only)
DT_MODEL=${DT_MODEL:-0.0}              # SPH integration step per tick in s; 0 = control period (0.05).
                                       #   try RTF*0.05 to make the model match simulated time (TEST_GUIDE T7)
CONTROL_PERIOD=${CONTROL_PERIOD:-0.05} # controller period: wall s with SIM_CLOCK=wall, SIMULATED s with SIM_CLOCK=gz
SIM_CLOCK=${SIM_CLOCK:-wall}           # wall = tick on wall time (old; also what REAL drones use)
                                       # gz   = tick on Gazebo SIMULATED time: correct at any RTF (simulation only)
MAX_VELOCITY=${MAX_VELOCITY:-0.5}      # m/s speed limit of the command (real drones: start with 0.2-0.3)
PLATFORM=${PLATFORM:-sim}              # sim | real (labels the run; real drones: see REAL_DRONES.md)
# safety latch (real drones): any drone outside this box, or no state for STATE_TIMEOUT_S -> 0 m/s to all, latched
FENCE_XMIN=${FENCE_XMIN:-nan}; FENCE_XMAX=${FENCE_XMAX:-nan}   # m, world frame; nan = open
FENCE_YMIN=${FENCE_YMIN:-nan}; FENCE_YMAX=${FENCE_YMAX:-nan}
STATE_TIMEOUT_S=${STATE_TIMEOUT_S:-0}  # s; 0 = off
STALE_POLICY=${STALE_POLICY:-predict}  # tick without a new state message: predict | hold | skip
START_GATE=${START_GATE:-flight}         # when the controller may act: none | all_known | flight
TEST_PROFILE=${TEST_PROFILE:-none}     # none | zero | step | square | sine | chirp  (replaces the SPH command)
TEST_AMP=${TEST_AMP:-0.15}             # m/s
TEST_PERIOD=${TEST_PERIOD:-4.0}        # s
TEST_AXIS=${TEST_AXIS:-x}              # x | y
TEST_DELAY=${TEST_DELAY:-3.0}          # s after the gate opens
TEST_DURATION=${TEST_DURATION:-60.0}   # s (chirp)